name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify scan command
        run: python main.py scan ./examples --report json

      - name: Verify apply command and artifact generation
        run: python main.py apply ./examples --write --emit-diff --emit-pr-report --artifacts-dir ./artifacts

      - name: Upload refactor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-artifacts-${{ matrix.os }}-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore

